x-bot-common: &bot-common
  build: .
  restart: unless-stopped
  mem_limit: 768m            # garde-fou anti-OOM (24 Go dispo, large)
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  volumes:
    - ./shared:/app/shared:ro
    - ./data:/app/data
    - ./logs:/app/bot/logs
  environment:
    - DATA_DIR=/app/data
  networks:
    - bots-network

services:
  sheogorath:
    <<: *bot-common
    container_name: bot-sheogorath
    volumes:
      - ./shared:/app/shared:ro
      - ./data:/app/data
      - ./Sheogorath:/app/bot:ro
      - ./logs:/app/bot/logs
      - ./Sheogorath/.master_key:/app/bot/.master_key:ro
    working_dir: /app/bot
    command: python bot_sheogorath.py
    environment:
      - DATA_DIR=/app/data
    # NOTE : voix clonée (TTS) et vision locale (Moondream) RETIRÉES du déploiement.
    # Services GPU non compatibles Oracle free tier — feature parkée à refaire.
    # Voir FEATURE_VOIX_VISION_GPU.md. Le code (sheo_voice.py, process_image_ollama)
    # dégrade proprement : texte sans voix, vision via Gemini cloud.

  maiq:
    <<: *bot-common
    container_name: bot-maiq
    volumes:
      - ./shared:/app/shared:ro
      - ./data:/app/data
      - ./MaiqBot:/app/bot:ro
      - ./logs:/app/bot/logs
      - ./MaiqBot/.master_key:/app/bot/.master_key:ro
    working_dir: /app/bot
    command: python bot_maiq.py

  alfred:
    <<: *bot-common
    container_name: bot-alfred
    volumes:
      - ./shared:/app/shared:ro
      - ./data:/app/data
      - ./Alfred:/app/bot:ro
      - ./logs:/app/bot/logs
      - ./Alfred/.master_key:/app/bot/.master_key:ro
    working_dir: /app/bot
    command: python bot_alfred.py

  johnny:
    <<: *bot-common
    container_name: bot-johnny
    volumes:
      - ./shared:/app/shared:ro
      - ./data:/app/data
      - ./JohnnyBot:/app/bot:ro
      - ./logs:/app/bot/logs
      - ./JohnnyBot/.master_key:/app/bot/.master_key:ro
    working_dir: /app/bot
    command: python bot_johnny.py

  onizuka:
    <<: *bot-common
    container_name: bot-onizuka
    volumes:
      - ./shared:/app/shared:ro
      - ./data:/app/data
      - ./OnizukaBot:/app/bot:ro
      - ./logs:/app/bot/logs
      - ./OnizukaBot/.master_key:/app/bot/.master_key:ro
    working_dir: /app/bot
    command: python bot_onizuka.py

  malena:
    <<: *bot-common
    container_name: bot-malena
    volumes:
      - ./shared:/app/shared:ro
      - ./data:/app/data
      - ./MalenaBot:/app/bot:ro
      - ./logs:/app/bot/logs
      - ./MalenaBot/.master_key:/app/bot/.master_key:ro  # Clé locale Malena
    working_dir: /app/bot
    command: python bot_malena.py

# ═══════════════════════════════════════════════════════════════
# SERVICES GPU RETIRÉS (feature parkée — voir FEATURE_VOIX_VISION_GPU.md)
# ───────────────────────────────────────────────────────────────
# Anciennement ici : bots-ollama-vision (Moondream), ollama-model-init,
# et chatterbox-tts (voice cloning Philippe Bozo, ~3-4 Go VRAM).
# Retirés car incompatibles Oracle free tier (aucun GPU). Le code reste
# dans le repo (chatterbox-server/, sheo_voice.py, process_image_ollama)
# et dégrade proprement. À refaire autrement plus tard.
# ═══════════════════════════════════════════════════════════════

networks:
  bots-network:
    driver: bridge
