name = "alfred-demo"
main = "src/index.js"
compatibility_date = "2026-10-15"

[assets]
directory = "./site"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Six messages par minute et par visiteur : le quota Groq gratuit ne tient pas davantage.
[[ratelimits]]
name = "LIMITEUR"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 6
  period = 60
