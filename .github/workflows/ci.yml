name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov

    - name: Compile python files
      run: python -m py_compile */bot_*.py */core/*.py

    - name: Run sonde_blocking_calls
      run: python tools/sonde_blocking_calls.py

    - name: Run sonde_core_drift
      run: python tools/sonde_core_drift.py

    - name: Run pytest
      run: python -m pytest -q
