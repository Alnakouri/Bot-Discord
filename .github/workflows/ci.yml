name: CI

# Ce workflow n'est pas decoratif : c'est LUI qui fait tourner la sonde de derive.
# Le noyau est vendorise en 7 exemplaires (shared/ + les 6 <Bot>/core/) ; sans cette
# execution automatique, deux routeurs peuvent diverger dans le meme processus sans
# que personne ne s'en apercoive.

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:        # permet de le lancer a la main depuis l'onglet Actions

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
    # ⚠️ Ces actions tournaient sur Node 20, dont GitHub a annonce la fin : le runner les
    # forcait deja sur Node 24 en emettant un avertissement a chaque execution. Montees
    # avant que l'avertissement devienne une panne. checkout v6+ et setup-python v6+
    # exigent un runner >= v2.327.1 (largement depasse sur les runners heberges).
    - uses: actions/checkout@v7

    - name: Python 3.11
      uses: actions/setup-python@v7
      with:
        # 3.11 : c'est la version des SIX conteneurs (Dockerfile, python:3.11-slim). La CI
        # doit tester ce qui tourne. Mesure du 22/09 : prod 3.11, CI 3.12, .venv 3.13.
        python-version: "3.11"
        cache: pip

    - name: Dependances systeme (audio pour discord.py[voice])
      run: sudo apt-get update && sudo apt-get install -y libopus0 libsodium23 ffmpeg

    - name: Dependances Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Compilation
      run: python -m py_compile */bot_*.py */core/*.py shared/*.py tools/*.py dashboard/backend/*.py

    - name: Aucun caractere de controle dans les sources
      # Un echappement rate laisse un octet invisible dans le code (deja arrive).
      run: |
        if grep -rlP '[\x00-\x08\x0b\x0c\x0e-\x1f]' --include="*.py" . ; then
          echo "::error::caractere de controle trouve dans un fichier source"
          exit 1
        fi

    - name: Sonde des appels bloquants
      run: python tools/sonde_blocking_calls.py

    - name: Sonde de derive du noyau vendorise
      run: python tools/sonde_core_drift.py

    - name: Le vendoring est bien a jour
      # Si quelqu'un a corrige shared/ sans relancer le script, le diff le montre.
      run: |
        python tools/vendor_core.py
        git diff --exit-code -- '*/core/' || {
          echo "::error::shared/ a ete modifie sans relancer python tools/vendor_core.py"
          exit 1
        }

    - name: Tests
      env:
        DASHBOARD_RELANCE_SANS_CONSOLE: "1"
      run: python -m pytest -q
